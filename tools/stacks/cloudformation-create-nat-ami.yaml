Description: Temporary stack to launch EC2 instance

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: brb-ami

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro

  FreeTierImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-05ffe3c48a9991133

Resources:
  AmiInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SsmPutParameterPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ami-creation/*

  AmiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AmiInstanceRole

  AMISecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      VpcId: !ImportValue brb-dev-vpc-id

  AMIInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      SubnetId: !ImportValue brb-public-subnet-id
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref AmiInstanceProfile
      SecurityGroupIds:
        - !Ref AMISecurityGroup
      ImageId: !Ref FreeTierImageId
      Tags:
        - Key: Name
          Value: brb-temp-ami-instance
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y iptables-services
          sysctl -w net.ipv4.ip_forward=1
          echo "net.ipv4_ip_forward = 1" >> /etc/sysctl.conf

          IFACE=$(ip route get 8.8.8.8 | awk '{ print $5; exit}')
          iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE

          service iptables save
          systemctl enable iptables

          yum install -y aws-cli
          aws ssm put-parameter --name "/ami-creation/instance-ready" --value "true" --type String --overwrite --region ${AWS::Region}

Outputs:
  AmiInstanceId:
    Description: Instance ID for AMI creation
    Value: !Ref AMIInstance
    Export:
      Name: brb-ami-instance-id
