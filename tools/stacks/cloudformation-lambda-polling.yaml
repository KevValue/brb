Description: Lambda function stack to create AMI from EC2 instance

Parameters:
  LambdaFunctionArn:
    Type: String
    Description: "ARN of the Lambda function"
    AllowedPattern: "^arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:.+$"
    ConstraintDescription: "Must be a valid Lambda function ARN"

Resources:
  AmiBuilderCustomResource:
    Type: Custom::AmiBuilder
    Properties:
      #ServiceToken: !GetAtt AmiCreationLambda.Arn
      ServiceToken: !Ref LambdaFunctionArn
      InstanceId: !ImportValue brb-ami-instance-id

Outputs:
  CreatedAmiId:
    Description: The newly created AMI ID
    Value: !GetAtt AmiBuilderCustomResource.ImageId
    Export:
      Name: brb-created-ami-id
